<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f7e5bd"/>
      <stop offset="50%" stop-color="#d8b06a"/>
      <stop offset="100%" stop-color="#a8823c"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="14" fill="#0a0a11"/>

  <!-- 外环：罗盘 -->
  <circle cx="32" cy="32" r="17.5" fill="none" stroke="url(#g)" stroke-width="3.4"/>

  <!-- 四向指针：贯穿到环外，小尺寸下仍能辨认出「十」字骨架 -->
  <g stroke="#e8c88a" stroke-width="2.8" stroke-linecap="round">
    <line x1="32" y1="7.5" x2="32" y2="15"/>
    <line x1="32" y1="49" x2="32" y2="56.5"/>
    <line x1="7.5" y1="32" x2="15" y2="32"/>
    <line x1="49" y1="32" x2="56.5" y2="32"/>
  </g>

  <!-- 中心：枢 -->
  <circle cx="32" cy="32" r="5.6" fill="url(#g)"/>
  <circle cx="32" cy="32" r="2" fill="#0a0a11"/>
</svg>
